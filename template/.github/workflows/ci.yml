name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check shell scripts
        run: |
          shellcheck docker/*.sh
          test -z "$(shfmt --list docker/*.sh)"

      - name: Format
        run: uv run --frozen ruff format . --check --diff

      - name: Lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest
